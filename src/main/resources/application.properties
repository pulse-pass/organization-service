spring.application.name=organization-service

# Database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:organization}
spring.datasource.username=${MYSQL_USER:organization}
spring.datasource.password=${MYSQL_PASSWORD:organization}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP (connection pool)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

# JSON
spring.jackson.property-naming-strategy=SNAKE_CASE

# Messages
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

# Token shared with the services allowed to call /internal/* routes
app.internal-token=${INTERNAL_TOKEN}

# Asaas base URL (selected by infrastructure/service-start.sh)
app.asaas.url=${ASAAS_URL:}
