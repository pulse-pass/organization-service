services:
  organization-service-mysql:
    image: mysql:8.0
    container_name: organization-service-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pulse-pass

  organization-service-mockserver:
    image: mockserver/mockserver:5.15.0
    profiles: [test]
    container_name: organization-service-mockserver
    ports:
      - "${MOCKSERVER_PORT}:1080"
    networks:
      - pulse-pass

  organization-service-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: organization-service-api
    env_file: .env
    environment:
      MYSQL_HOST: organization-service-mysql
      MYSQL_PORT: 3306
      ASAAS_URL: ${ASAAS_URL}
    ports:
      - "${API_PORT}:8080"
    cap_add:
      - SYS_TIME
    depends_on:
      organization-service-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pulse-pass

networks:
  pulse-pass:
    external: true
