name: organization-service-test

services:
  mysql:
    image: mysql:8.0
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-organization-service-test}-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pulse-pass

  mockserver:
    image: mockserver/mockserver:5.15.0
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-organization-service-test}-mockserver
    ports:
      - "${MOCKSERVER_PORT}:1080"
    networks:
      - pulse-pass

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ${SERVICE_PREFIX:-organization-service-test}-api
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-organization-service-test-mysql}
      MYSQL_PORT: 3306
      ASAAS_URL: ${ASAAS_URL:-${ASAAS_TEST_URL}}
    ports:
      - "${PUBLISHED_API_PORT:-8082}:8080"
    cap_add:
      - SYS_TIME
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pulse-pass

networks:
  pulse-pass:
    external: true
